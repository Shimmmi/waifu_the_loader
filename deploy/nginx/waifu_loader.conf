# Подключается внутри server { listen 443 ... server_name shimmirpgbot.ru; } строкой:
#   include /opt/Waifu_Loader/deploy/nginx/waifu_loader.conf;
# Все location с ^~ — не пересекаются с regex-локациями соседних проектов.

location = /waifu_loader {
    return 301 /waifu_loader/;
}

location ^~ /waifu_loader/api/ {
    proxy_pass http://127.0.0.1:8040;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
    client_max_body_size 256k;
}

location ^~ /waifu_loader/portraits/ {
    alias /opt/Waifu_Loader/data/portraits/;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /waifu_loader/assets/ {
    alias /opt/Waifu_Loader/data/www/assets/;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ^~ /waifu_loader/ {
    alias /opt/Waifu_Loader/data/www/;
    try_files $uri $uri/ /waifu_loader/index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
